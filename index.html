<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="./assets/icons/poke-ball.svg" />
        <title>Pokédex</title>
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/keyframes.css" />
        <link rel="stylesheet" href="./styles/pokemon-type-specific.css" />
        <link rel="stylesheet" href="./styles/card.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="./styles/spinner.css" />
        <link rel="stylesheet" href="./styles/shell.css" />
        <link rel="stylesheet" href="./style.css" />
        <script src="./scripts/templates.js" defer></script>
        <script src="./scripts/dialog.js" defer></script>
        <script src="./script.js" defer></script>
    </head>
    <body onload="init(1)" id="page-top">
        <div
            id="load-animation-container"
            class="load-animation-container load-animation-enable"
            aria-hidden="true"
        ></div>
        <header class="header-main content-limit-1440p">
            <nav>
                <a href="#page-top" aria-label="go to top of page">
                    <div id="spinner-header" class="spinner-outside spinner-animation-enable">
                        <div class="spinner-inside"></div>
                        <div class="line-inside-left"></div>
                        <div class="line-inside-right"></div>
                    </div>
                </a>
                <div class="search-field">
                    <input
                        data-id="search-input"
                        id="search-field"
                        type="text"
                        name="search field"
                        value=""
                        aria-labelledby="btn-search"
                        onkeyup="processSearchBtn()"
                        disabled
                    />
                    <button
                        data-id="search-button"
                        id="btn-search"
                        onclick="filterFromLocal()"
                        disabled
                        role="button"
                        aria-controls="main-content"
                        aria-label="apply search filter"
                    >
                        Search
                    </button>
                    <button
                        id="btn-reset"
                        class="btn-reset d-none"
                        onclick="reset()"
                        disabled
                        role="button"
                        aria-controls="main-content"
                        aria-label="reset search filter"
                    >
                        Reset
                    </button>
                    <p data-id="not-found" id="nothing-found" class="d-none">Nothing found!</p>
                </div>
                <div id="btn-favorites-wrapper" class="search-field">
                    <button
                        id="btn-favorites"
                        onclick="renderLiked()"
                        role="button"
                        aria-controls="main-content"
                        aria-label="filter for favorites"
                    >
                        Favorites
                    </button>
                </div>
            </nav>
            <div class="header-wave"></div>
        </header>

        <header class="page-headline">
            <img src="./assets/img/pokemon-logo.svg" alt="pokemon logo" />
            <h2>Pokédex</h2>
        </header>

        <main data-id="content" class="content-limit-1280p">
            <section id="main-content" class="main-content"></section>
            <button
                data-id="load-more-button"
                id="btn-more"
                class="btn-more"
                onclick="loadMore(40)"
                disabled
                role="button"
                aria-controls="main-content"
                aria-label="load more"
            >
                <p id="load-btn-txt" class="d-none">Load more</p>
                <div id="load-dot-1" class="load-dot-1"></div>
                <div id="load-dot-2" class="load-dot-2"></div>
                <div id="load-dot-3" class="load-dot-3"></div>
            </button>
        </main>

        <footer class="content-limit-1440p">
            <div class="footer-content">
                <p>
                    © 2026 Sven Primus<br />Ressources: <a href="https://pokeapi.co/" target="_blank">PokéAPI</a>,
                    <a href="https://github.com/duiker101/pokemon-type-svg-icons" target="_blank">duiker101</a>
                </p>
                <a href="https://github.com/svenprimus" target="_blank">
                    <p>GitHub<br />svenprimus</p>
                    <img src="./assets/img/impressum.jpg" alt="profil-picture of website developer" />
                </a>
            </div>
            <div class="footer-wave"></div>
        </footer>

        <dialog data-id="dialog" id="poke-dialog" onclick="closeDialog()" aria-labelledby="dialog-title">
            <article data-id="overlay-pokemon-name" class="dialog-wrapper" onclick="stopDialogPropagation(event)">
                <header class="dialog-header">
                    <div id="dialog-header-content"></div>
                    <button
                        data-id="close-dialog-button"
                        id="dialog-button-close"
                        class="dialog-button-close"
                        aria-controls="pokemon-dialog"
                        aria-label="close dialog"
                        role="button"
                        onkeydown="closeDialogbyEnter()"
                        onclick="closeDialog()"
                    ></button>
                </header>
                <div id="pokemon-bg-wrapper" class="pokemon-dialog-bg-wrapper"></div>
                <div id="dialog-like-wrapper" class="dialog-like-wrapper"></div>

                <section class="dialog-slider">
                    <div class="dialog-radio-btn-wrapper">
                        <input
                            type="radio"
                            id="radio-about"
                            name="slider"
                            value="one"
                            checked
                            value="one"
                            role="tab"
                            aria-labelledby="radio-about-label"
                        />
                        <label id="radio-about-label" for="radio-about">About</label>
                    </div>
                    <div class="dialog-radio-btn-wrapper">
                        <input
                            type="radio"
                            id="radio-base-stats"
                            name="slider"
                            value="two"
                            role="tab"
                            aria-labelledby="radio-base-stats-label"
                        />
                        <label id="radio-base-stats-label" for="radio-base-stats">Base Stats</label>
                    </div>

                    <div class="dialog-radio-btn-wrapper">
                        <input
                            type="radio"
                            id="radio-animation"
                            name="slider"
                            value="three"
                            role="tab"
                            aria-labelledby="radio-animation-label"
                        />
                        <label id="radio-animation-label" for="radio-animation">Animation</label>
                    </div>

                    <div id="dialog-slider-wrapper" class="dialog-slider-wrapper">
                        <div class="dialog-slider-element" id="dialog-element-about">
                            <table class="dialog-table">
                                <tr>
                                    <th>Species</th>
                                    <td id="about-species"></td>
                                </tr>
                                <tr>
                                    <th>Height</th>
                                    <td id="about-height"></td>
                                </tr>
                                <tr>
                                    <th>Weight</th>
                                    <td id="about-weight"></td>
                                </tr>
                                <tr>
                                    <th>Abilities</th>
                                    <td id="about-abilities"></td>
                                </tr>
                            </table>
                        </div>
                        <div class="dialog-slider-element" id="dialog-element-base-stats">
                            <table class="dialog-table">
                                <tr>
                                    <th>HP</th>
                                    <td id="stats-hp"></td>
                                </tr>
                                <tr>
                                    <th>Attack</th>
                                    <td id="stats-attack"></td>
                                </tr>
                                <tr>
                                    <th>Defense</th>
                                    <td id="stats-defense"></td>
                                </tr>
                                <tr>
                                    <th>Sp. Atk</th>
                                    <td id="stats-attack-sp"></td>
                                </tr>
                                <tr>
                                    <th>Sp. Def</th>
                                    <td id="stats-defense-sp"></td>
                                </tr>
                                <tr>
                                    <th>Speed</th>
                                    <td id="stats-speed"></td>
                                </tr>
                                <tr>
                                    <th>Total</th>
                                    <td id="stats-total"></td>
                                </tr>
                            </table>
                        </div>
                        <div class="dialog-slider-element justify-center" id="dialog-element-animation"></div>
                    </div>
                </section>

                <section id="dialog-evolution-chain" class="dialog-evolution-chain"></section>

                <nav id="dialog-nav" class="dialog-nav">
                    <button
                        id="dialog-button-return"
                        class="dialog-button-return"
                        tabindex="0"
                        aria-controls="pokemon-dialog"
                        aria-label="close dialog"
                        role="button"
                        onkeydown="closeDialogbyEnter()"
                        onclick="closeDialog()"
                    ></button>
                    <button
                        data-id="prev-button"
                        id="dialog-button-left"
                        class="dialog-button-left"
                        tabindex="0"
                        aria-controls="pokemon-dialog"
                        aria-label="previous pokemon"
                        role="button"
                    ></button>
                    <button
                        data-id="next-button"
                        id="dialog-button-right"
                        class="dialog-button-right"
                        tabindex="0"
                        aria-controls="pokemon-dialog"
                        aria-label="next pokemon"
                        role="button"
                    ></button>
                </nav>
            </article>
        </dialog>
    </body>
</html>
